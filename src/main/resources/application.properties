spring.application.name=AiAssistant

server.port=8080

# Local MySQL configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_assistant}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root12345}
spring.jpa.hibernate.ddl-auto=update

#OpenAI Configuration
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-120b
spring.ai.openai.chat.replay-reasoning-content=false

logging.level.org.springframework.ai=DEBUG


